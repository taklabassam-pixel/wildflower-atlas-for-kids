<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أطلس الزهور - استخراج الأيقونة النهائية المعتمدة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #e8e2d6; font-family: 'Amiri', serif; text-align: center; padding: 40px; color: #1a472a; }
        .preview-card { max-width: 550px; margin: 0 auto; background: white; padding: 40px; border-radius: 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); }
        .logo-shadow { filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2)); }
        button { background: #1a472a; color: #fdfaf1; border: none; padding: 18px 35px; font-size: 1.3rem; font-family: 'Amiri', serif; font-weight: bold; border-radius: 15px; cursor: pointer; margin-top: 30px; transition: 0.3s; }
        button:hover { background: #2d7a48; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="preview-card">
    <h2 style="margin-top:0">الأيقونة النهائية المعتمدة</h2>
    <p>تصميم نقي وممركز تماماً: خطوط مكبرة بنسبة 12%، زهرة دوار الشمس العريضة، والقلب الأصفر المشرق.</p>
    
    <svg id="finalAtlasLogo" class="logo-shadow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="400" height="400">
      <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700;900&display=swap');
            .text-path-top { font-family: 'Amiri', serif; font-size: 28px; font-weight: bolder; fill: #1a472a; }
            .text-path-bottom { font-family: 'Amiri', serif; font-size: 28px; font-weight: bold; fill: #1a472a; }
        </style>
        <path id="topCurve" d="M 65,256 A 191,191 0 0,1 447,256" fill="none" />
        <path id="bottomCurve" d="M 65,256 A 191,191 0 0,0 447,256" fill="none" />
      </defs>

      <rect width="512" height="512" fill="#25944c" />

      <circle cx="256" cy="256" r="235" fill="#fffaf1" stroke="#ed7d53" stroke-width="8"/>
      
      <text class="text-path-top">
        <textPath href="#topCurve" startOffset="50%" text-anchor="middle">أطلس الأشجار، النباتات والأزهار البرية التفاعلي</textPath>
      </text>

      <text class="text-path-bottom">
        <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">منحدرات وأودية أراضي بلدة العزونية - لبنان</textPath>
      </text>

      <g transform="translate(256, 256) scale(0.92)">
        <g fill="#e67e22">
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(0)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(30)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(60)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(90)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(120)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(150)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(180)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(210)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(240)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(270)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(300)"/>
          <path d="M-24,0 Q-24,-120 0,-135 Q24,-120 24,0 Z" transform="rotate(330)"/>
        </g>

        <circle cx="0" cy="0" r="45" fill="#5d4037" stroke="#2c3e50" stroke-width="2"/>
        <circle cx="0" cy="0" r="34" fill="none" stroke="#2980b9" stroke-width="4"/>
        <circle cx="0" cy="0" r="24" fill="#ffeb3b" /> 
        <circle cx="0" cy="0" r="7" fill="#fff" opacity="0.5"/>
      </g>
    </svg>
    
    <br>
    <button onclick="downloadFinalPng()">تحميل الأيقونة النهائية (atlas_logo.png)</button>
</div>

<script>
function downloadFinalPng() {
    const svg = document.getElementById('finalAtlasLogo');
    const svgData = new XMLSerializer().serializeToString(svg);
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    
    // تصدير بدقة شاشات الموبايل الحديثة المتوافقة مع أندرويد وآيفون
    const size = 1024; 
    canvas.width = size;
    canvas.height = size;
    
    const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    
    img.onload = function() {
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
        const pngUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'atlas_logo.png';
        link.href = pngUrl;
        link.click();
    };
    img.src = url;
}
</script>
</body>
</html>
