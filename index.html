<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="app_icon-192.png">
    <meta name="theme-color" content="#689f38">
    <link rel="icon" type="image/png" href="app_icon.png">
    <title>أطلس النباتات والأزهار البرية</title>
    <style>
        body {
            perspective: 1500px; 
            transform-style: preserve-3d;
        }
        /* 🌟 1. التنسيقات العامة وجسم الصفحة 🌟 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f8e9; /* لون خلفية الأطلس الدافئ */
            overflow-x: hidden;
            /* تهيئة البعد الثالث لجسم الصفحة بالكامل لحركة كتاب السحرية */
            perspective: 1500px; 
        }
/* 🌟 2. تنسيقات الشاشة الترحيبية (غلاف الكتاب السحري) 🌟 */
        /* 🌟 2. تنسيقات الشاشة الترحيبية المحدثة (إظهار المستكشف كاملاً) 🌟 */
        .splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #f1f8e9; /* لون نباتي متناسق مع الأطلس */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transform-origin: right center;
            backface-visibility: hidden;
            transition: transform 2.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 2.2s ease-in-out, visibility 2.2s;
            transform: rotateY(0deg);
            opacity: 1;
            box-shadow: inset -15px 0 30px rgba(0,0,0,0.15);
        }

        .splash-container.page-flip {
            transform: rotateY(140deg) translateX(200px);
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }

        .splash-content {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 500px; /* تحديد العرض الأقصى ليتناسب مع الهواتف أيضاً */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 🛠️ تعديل حاوية الفيديو/الصورة لتناسب الأبعاد الأصلية للمستكشف بدون أي قص */
       /* 🛠️ تعديل أبعاد الحاوية لتصبح متناسقة طولياً كصورة بورتريه سحرية */
        .video-mask-wrapper {
            width: 100%;
            max-width: 380px;     /* عرض مريح ومتناسق جداً على الشاشات والهواتف */
            height: auto;          
            aspect-ratio: 3 / 4;   /* تحويل الإطار إلى شكل طولي (3 عرض مقابل 4 طول) ليتسع للقبعة والوجه معاً */
            margin: 0 auto 20px auto;
            overflow: hidden;   
            border-radius: 24px; 
            box-shadow: 0 12px 35px rgba(46, 125, 50, 0.15); 
            position: relative;
            background-color: #ffffff; 
            border: 4px solid #2e7d32; /* الإطار الأخضر الجميل الخاص بك */
        }

        /* 🛠️ ضبط التكبير والتركيز لجمع الرأس والقبعة والأدوات دون أي قص */
        .splash-video {
            width: 100%;
            height: 100%;
            /* تقليل التكبير قليلاً إلى 1.25 لتدخل القبعة بالكامل داخل الحاوية الطولية الجديدة */
            transform: scale(1.25); 
            /* إعادة ضبط المركز ليكون متوازناً تماماً */
            transform-origin: center 12%; 
            object-fit: cover;
            background-color: #ffffff; 
            display: block;
        }
        .splash-title {
            color: #2e7d32;
            font-size: 2.8rem; /* تكبير بسيط ومناسب للأطفال */
            margin: 15px 0 5px 0;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .splash-subtitle {
            color: #689f38;
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .start-button {
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            padding: 12px 50px;
            font-size: 1.8rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(46, 125, 50, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            display: inline-block;
        }

        .start-button:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.4);
        }

     
        /* 🌟 3. تنسيقات شاشة بطاقات النباتات والمسابقات (أصلية 100%) 🌟 */
        :root {
            --primary-color: #FFD700;
            --bg-color: #E0F7FA;
            --correct-color: #4CAF50;
            --wrong-color: #F44336;
            --text-dark: #37474F;
        }

        /* 1. الكلاس الأساسي (يمثل حالة الخروج وحالة الدخول البدئية معاً) */
        .main-app-wrapper {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            backface-visibility: hidden;
            transform-origin: right center; 

            /* الحالة البدئية للدخول والنهائية للخروج */
            transform: rotateY(270deg) translateZ(-300px);
            opacity: 0;

            /* 🌟 خدعة الخروج: عند حذف الكلاس واختفاء الصفحة، نجعل الـ opacity تختفي بسرعة خاطفة (0.4 ثانية) */
            /* بينما الـ transform يأخذ وقت أطول لكي لا يلاحظ الطفل الدوران العكسي العنيف أثناء الاختفاء */
            transition: transform 1.5s ease-in, opacity 0.4s ease-in;
        }

        /* 2. حالة الاستقرار عند الفتح (الصفحة الداخلة) */
        .main-app-wrapper.page-enter {
            transform: rotateY(360deg) translateZ(0);
            opacity: 1;

            /* 🌟 خدعة الدخول: عندما يضاف الكلاس لفتح الصفحة الجديدة، نعطيها ثانيتين كاملتين (2s) */
            /* لتأخذ راحتها في الانبثاق والدوران الموحد من زاوية 270 إلى 360 بنعومة بالغة أمام الطفل */
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1), opacity 2s ease-in-out;
        }
        
        .card-container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            padding: 25px;
            text-align: center;
            border: 5px solid #A5D6A7;
            position: relative;
        }
        
        .navigation-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-nav {
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-nav:active { transform: scale(0.95); }
        #btn-prev { background-color: #BDBDBD; }
        #btn-next { background-color: #66BB6A; }
        
        .btn-nav:disabled {
            background-color: #E0E0E0 !important;
            color: #9E9E9E;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        h1 {
            color: #2E7D32;
            font-size: 24px;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        
        .stage {
            width: 220px;
            height: 220px;
            margin: 0 auto 20px auto;
            position: relative;
            perspective: 1000px;
        }

        .stage-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .stage-inner.cartoon-mode {
            animation: floating 3s ease-in-out infinite;
        }

        .stage.flipped .stage-inner {
            transform: rotateY(180deg);
        }

        .img-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 25px;
            border: 5px solid var(--primary-color);
            background: #FFF9C4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            user-select: none;
        }

        .img-face.real {
            transform: rotateY(180deg);
            background: #E8F5E9;
            border-color: #81C784;
        }
        
        .welcome-text {
            font-size: 22px;
            font-weight: bold;
            color: rgb(235, 42, 8);
            margin-bottom: 15px;
        }

       /* 🛠️ الإصلاح الجذري والقاطع لحركة شريط النص 🛠️ */
        .story-marquee-container {
            width: 90%;
            margin: 20px auto;
            overflow: hidden; /* يمنع خروج النص خارج الصندوق */
            background: #FFFDE7; 
            border: 3px dashed #FFB300; 
            border-radius: 15px;
            padding: 15px;
            position: relative;
            box-sizing: border-box;
            display: none; /* يظهر عبر الـ JS */
        }

       .story-marquee-text {
            display: inline-block;
            white-space: nowrap; 
            font-size: 1.4rem;
            color: #2E7D32;
            font-weight: bold;
            width: max-content;
            
            /* 🛠️ الحل الجذري لإجبار النقطة على الظهور في آخر القصة على اليسار 🛠 */
            direction: rtl !important;               /* تحديد اتجاه النص من اليمين إلى اليسار */
            unicode-bidi: isolate;        /* عزل النص برمجياً لمنع تداخل علامات الترقيم */
            text-align: right !important;            /* محاذاة النص للبدء من اليمين */
            
            /* تفعيل خاصية الحركة الإجبارية */
            position: relative;
            will-change: transform;
            animation: marqueeEffect 50s linear infinite !important;
        }
        /* 🎬 الأنيميشن الفعلي: يجبر النص على الانطلاق من أقصى اليمين إلى أقصى اليسار */
        @keyframes marqueeEffect {
            0% {
                transform: translate3d(-10%, 0, 0);
            }
            100% {
                transform: translate3d(110%, 0, 0);
            }
        }

       /* 🌟 جعل الأزرار في نفس الصف وبمحاذاة مثالية 🌟 */
        .controls-wrapper {
            display: flex;
            justify-content: center; /* توزيع الأزرار بالتساوي في المنتصف */
            align-items: center;    /* محاذاة الأزرار عمودياً على نفس الخط */
            gap: 20px;              /* المسافة بين الزرين */
            margin-bottom: 20px;
            width: 100%;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;                /* يضمن توزيعاً متساوياً للمساحة لكل زر */
        }

        .btn-child {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 32px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-child:active { transform: scale(0.93); }
        .btn-audio { background-color: #FF7043; color: white; }
        
        /* 🛠️ تم إلغاء الإزاحة (translateX) ليبقى الزر في مكانه الصحيح في الصف */
        .btn-lens { background-color: #29B6F6; color: white; }
    
        .btn-label { 
            font-size: 16px; /* تقليل الخط قليلاً ليتناسب مع العرض في نفس الصف */
            font-weight: bold;
            color: var(--text-dark);
            text-align: center;
        }

        /* 🛠️ تم إلغاء الإزاحة من النص أيضاً ليصبح أسفل الزر مباشرة وبشكل متناسق */
        .image-label-move {
            display: inline-block;
        }

        .btn-sesame {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
            border: 4px solid #FFE082;
            border-radius: 20px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(245, 124, 0, 0.3);
            transition: all 0.3s ease;
            margin: 10px auto;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .btn-sesame:hover { transform: scale(1.04); }
        .btn-sesame:active { transform: scale(0.96); }
        
        .story-box {
            background: #FFF3E0;
            border-radius: 20px;
            padding: 15px;
            border-right: 6px solid #FF7043;
            margin-top: 10px;
            text-align: right;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-dark);
            display: none; 
            animation: fadeIn 0.4s ease-out;
        }

        .fact-box {
            background: #F1F8E9;
            border-radius: 20px;
            padding: 15px;
            border-right: 6px solid #4CAF50;
            margin-top: 10px;
            text-align: right;
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-dark);
            display: none; 
            animation: fadeIn 0.4s ease-out;
        }

        .quiz-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 3px dashed #C8E6C9;
            display: none; 
            text-align: right;
            animation: fadeIn 0.5s ease-out;
        }

        .quiz-title {
            color: #E65100;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .option-btn {
            background-color: #FFFFFF;
            border: 3px solid #B0BEC5;
            border-radius: 15px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            color: var(--text-dark);
            text-align: right;
            transition: background-color 0.2s;
        }

        .option-btn.correct {
            background-color: #E8F5E9 !important;
            border-color: var(--correct-color) !important;
            color: #2E7D32 !important;
        }

        .option-btn.wrong {
            background-color: #FFEBEE !important;
            border-color: var(--wrong-color) !important;
            color: #C62828 !important;
        }
        
        /* تأثيرات الحركة والأنيميشن */
        @keyframes floating {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 124, 0, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(245, 124, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 124, 0, 0); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #ff0;
            top: -10px;
            z-index: 9999; 
            border-radius: 50%;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* 1. تهيئة الحاوية الكبرى للنبتة لتصبح بيئة ثلاثية الأبعاد */
        /* الحاوية الكبرى - تأكد أن هذا الكلاس مضاف للـ div المحيط بالبطاقة */
        /* الحاوية الكبرى - نضمن عدم وجود overflow: hidden يمنع الأنميشن */
        .plant-card-container {
            transition: all 0.5s ease-in-out;
            position: relative;
            will-change: transform, opacity; /* تنبيه المتصفح لتجهيز كارت الشاشة للحركة */
        }

        /* حركة الانتقال للنبتة التالية (خروج ودخول مبهج) */
        .flip-left-effect {
            animation: slideOutLeft 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* حركة العودة للنبتة السابقة */
        .flip-right-effect {
            animation: slideOutRight 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* أنميشن الذهاب للتالي: البطاقة تصغر قليلاً، تنزلق وتختفي، ثم تظهر الجديدة ناصعة */
        @keyframes slideOutLeft {
            0% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
            45% {
                transform: translateX(-100px) scale(0.9);
                opacity: 0;
            }
            55% {
                transform: translateX(100px) scale(0.9);
                opacity: 0;
            }
            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        /* أنميشن العودة للسابق */
        @keyframes slideOutRight {
            0% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
            45% {
                transform: translateX(100px) scale(0.9);
                opacity: 0;
            }
            55% {
                transform: translateX(-100px) scale(0.9);
                opacity: 0;
            }
            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
     
   <div id="splash-screen" class="splash-container">
    <div class="splash-content">
        <div class="video-mask-wrapper">
            <video id="welcome-video" class="splash-video" preload="auto" playsinline webkit-playsinline muted>
                <source src="welcome_video.mp4" type="video/mp4">
                المتصفح لا يدعم تشغيل هذا الفيديو.
            </video>
        </div>
        <h1 class="splash-title">أَطْلَسُ النَّبَاتَاتِ</h1>
        <p class="splash-subtitle">وَالأَزْهَارِ البَرِّيَّةِ</p>
        <button id="start-btn" class="start-button">لِنَبْدَأْ ! </button>
    </div>
</div>
    <div id="main-app-content" class="main-app-wrapper">
        <div class="card-container">
            
            <div class="navigation-box">
                <button class="btn-nav" id="btn-prev" onclick="navigatePlant(-1)">➡️ السابق</button>
                <button class="btn-nav" id="btn-next" onclick="navigatePlant(1)">التالي ⬅️</button>
            </div>

            <h1 id="plant-title">جاري تحميل الأطلس...</h1>
            
            <div class="stage" id="photo-stage" onclick="onLensClicked()">
                <div class="stage-inner cartoon-mode" id="stage-inner">
                    <div class="img-face cartoon" id="cartoon-display">🌻</div>
                    <div class="img-face real" id="real-display">🌼</div>
                </div>
            </div>

            <div class="welcome-text" id="welcome-message">مرحبا يا أصدقاء</div>
             
            <div id="story-text-window" class="story-marquee-container" style="display: none;">
                <div id="animated-story-text" class="story-marquee-text"></div>
            </div>

            <div class="controls-wrapper">
                <div class="control-item">
                    <button id="btn-view-image" class="btn-child btn-lens" onclick="onViewImageClicked()">🔍</button>
                    <span id="label-view-image" class="btn-label image-label-move">شاهدوا صورتي في الطبيعة</span>
                </div>

                <!-- الحاوية الكبرى التي تضم كل محتويات النبتة والتي ستنقلب بصرياً -->
                <div id="plant-page-card" class="plant-card-container page-enter">
    <!-- محتوى نبتتك بالكامل -->
</div>
                <div class="control-item">
                    <button id="audio-button" class="btn-child btn-audio" onclick="onListenStoryClicked(this)">🔊</button>
                    <span class="btn-label">اسمعوا قصتي</span> 
                </div>
            </div>

            <button class="btn-sesame" id="sesame-trigger" onclick="onSesameClicked()">✨ افتح يا سمسم! 📦</button>

            <div class="story-box" id="story-display"></div>
            <div class="fact-box" id="fact-display"></div>

            <div class="quiz-container" id="quiz-area">
                <div class="quiz-title">🎮 سؤال المستكشف الذكي:</div>
                <div id="quiz-question-text" style="font-size: 16px; color: #424242;">جاري تجهيز التحدي...</div>
                <div class="quiz-options" id="quiz-options-box"></div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const welcomeVideo = document.getElementById("welcome-video");
            const startBtn = document.getElementById("start-btn");
            const splashScreen = document.getElementById("splash-screen");
            let fallbackTimeout = null;

            // دالة انتقال قلب الصفحة ثلاثي الأبعاد المتزامن
            function bookPageFlipTransition() {
                console.log("📖 يتم الآن فتح كتاب الأطلس السحري...");
                
                // إلغاء مؤقت الأمان لتجنب التداخل
                if (fallbackTimeout) clearTimeout(fallbackTimeout);

                if (welcomeVideo) {
                    welcomeVideo.pause();
                }
                
                // 1. تفعيل كلاس قلب الغلاف المحدث لليمين واختفائه
                if (splashScreen) {

       /**
         * 🎵 نظام إدارة الصوت التفاعلي المطور لأطلس النباتات والزهور البرية
         * يتكفل بتشغيل ملفات الـ MP3 ومزامنة حركة النص بصرياً وتغيير أيقونات الأزرار تلقائياً
         */

        class AtlasAudioManager {
            constructor() {
                this.currentAudio = null;       // يحتفظ بكائن الصوت الحالي
                this.currentPlantCode = null;  // يحتفظ بشفرة النبتة الحالية
                this.isPlaying = false;        // حالة التشغيل الحالية
                this.TARGET_CPS = 11.5;        // 🎯 معيار الاتزان الرياضي المعتمد (حرف في الثانية)
                this.AUDIO_BASE_PATH = 'audio/ar/'; // 🌟 المسار الموجه الصحيح داخل حزمة الأندرويد
            }

            /**
             * الدالة الرئيسية لتشغيل أو إيقاف صوت قصة النبتة مع مزامنة حركة النص وتحديث الأيقونة
             * @param {string} characterCode - المعرف الفريد للنبتة (مثل: cyclamen_persicum)
             * @param {string} storyText - النص العربي الكامل للقصة المستخرج من الـ JSON
             * @param {HTMLElement} animatedTextElement - عنصر الواجهة الذكي الذي يتحرك برمجياً
             * @param {HTMLElement} buttonElement - عنصر الزر لتحديث شكله بصرياً
             */
            togglePlay(characterCode, storyText, animatedTextElement, buttonElement) {
                // 1. حالة الضغط على نفس زر النبتة الحالية (باوز / استئناف)
                if (this.currentAudio && this.currentPlantCode === characterCode) {
                    if (this.isPlaying) {
                        this.pauseTrack(buttonElement, animatedTextElement);
                    } else {
                        this.playTrack(buttonElement, animatedTextElement);
                    }
                    return;
                }

                // 2. تصفير النبتة السابقة فوراً
                this.stopCurrentTrack(animatedTextElement);

                this.currentPlantCode = characterCode;
                const audioSource = `${this.AUDIO_BASE_PATH}${characterCode}.mp3`;
                
                this.currentAudio = new Audio(audioSource);
                if (animatedTextElement) {
                    animatedTextElement.innerText = storyText;
                    // 🌟 إزالة الأنميشن برمجياً بشكل مؤقت لحين تحميل الميتادات
                    animatedTextElement.style.setProperty('animation-name', 'none', 'important'); 
                }

                this.currentAudio.addEventListener('loadedmetadata', () => {
                    const textLength = storyText.length;
                    const idealDuration = textLength / this.TARGET_CPS;
                    const actualAudioDuration = this.currentAudio.duration; 

                    let calculatedPlaybackRate = actualAudioDuration / idealDuration;
                    if (calculatedPlaybackRate < 0.85) calculatedPlaybackRate = 0.85;
                    if (calculatedPlaybackRate > 1.75) calculatedPlaybackRate = 1.75;

                    this.currentAudio.playbackRate = calculatedPlaybackRate;
                    const finalAnimationDuration = actualAudioDuration / calculatedPlaybackRate;

                    if (animatedTextElement) {
                        void animatedTextElement.offsetWidth; // ريست هندسي للـ DOM
                        // تطبيق مدة الحركة المتزامنة رياضياً بإجبارية أعلى من الـ CSS
                        animatedTextElement.style.setProperty('animation-duration', `${finalAnimationDuration}s`, 'important');
                    }
                });

                // 🏁 انطلاق الأنميشن الفعلي مع خروج الصوت الذاتي من السماعة
                this.currentAudio.addEventListener('playing', () => {
                    if (animatedTextElement) {
                        animatedTextElement.style.setProperty('animation-name', 'marqueeEffect', 'important');
                        animatedTextElement.style.setProperty('animation-play-state', 'running', 'important');
                    }
                });

                this.currentAudio.addEventListener('ended', () => {
                    this.handleAudioEnded(buttonElement, animatedTextElement);
                });

                this.currentAudio.addEventListener('error', (e) => {
                    console.error(`❌ تعذر تحميل ملف الصوت: ${audioSource}`);
                    this.resetManager(buttonElement, animatedTextElement);
                });

                this.playTrack(buttonElement, animatedTextElement);
            }

           // دالة بدء التشغيل واستئناف الحركة النصية بعد الباوز
           // دالة بدء التشغيل واستئناف الحركة النصية بعد الباوز
           // دالة بدء التشغيل واستئناف الحركة النصية من نفس النقطة بدون العودة للبداية
            playTrack(buttonElement, animatedTextElement) {
                if (!this.currentAudio) return;

                this.currentAudio.play()
                    .then(() => {
                        this.isPlaying = true;
                        if (buttonElement) {
                            buttonElement.innerHTML = "⏸️";
                            buttonElement.classList.add('audio-playing');
                        }
                        
                        if (animatedTextElement) {
                            // ▶️ استئناف الحركة من نفس مكان التجميد بدقة
                            animatedTextElement.style.transform = '';
                            
                            // إذا كان هناك وقت محفوظ من الباوز، نقوم بحقنه بالسالب ليقفر المتصفح إليه فوراً
                            if (this.savedAnimationTime) {
                                animatedTextElement.style.setProperty('animation-delay', `-${this.savedAnimationTime}s`, 'important');
                            }
                            
                            animatedTextElement.style.setProperty('animation-name', 'marqueeEffect', 'important');
                        }
                        console.log(`🔊 استئناف التشغيل متزامناً لـ: ${this.currentPlantCode}`);
                    })
                    .catch(error => {
                        console.warn("⚠️ قيود أمان المتصفح تمنع التشغيل التلقائي:", error);
                    });
            }

            // دالة الإيقاف المؤقت (الباوز) وتجميد النص وحفظ التوقيت الحالي
            pauseTrack(buttonElement, animatedTextElement) {
                if (!this.currentAudio) return;
                
                // 🎯 حساب اللحظة الزمنية الحالية للصوت للاستفادة منها في حركة النص
                this.savedAnimationTime = this.currentAudio.currentTime;
                
                this.currentAudio.pause();
                this.isPlaying = false;
                
                if (buttonElement) {
                    buttonElement.innerHTML = "🔊";
                    buttonElement.classList.remove('audio-playing');
                }
                
                if (animatedTextElement) {
                    // التقاط مصفوفة المكان الحالية للنص على الشاشة وتثبيتها
                    const computedStyle = window.getComputedStyle(animatedTextElement);
                    const currentTransform = computedStyle.transform || computedStyle.webkitTransform;
                    
                    animatedTextElement.style.transform = currentTransform;
                    
                    // إيقاف الأنميشن مؤقتاً
                    animatedTextElement.style.setProperty('animation-name', 'none', 'important');
                }
                console.log(`⏸️ تم تجميد النص بصرياً وحفظ توقيت اللحظة: ${this.savedAnimationTime} ثانية`);
            }

            // دالة قطع الصوت تماماً وتصفيره وإلغاء الحركات والتوقيت المحفوظ (عند التنقل بين النباتات)
            stopCurrentTrack(animatedTextElement) {
                if (this.currentAudio) {
                    this.currentAudio.pause();
                    this.currentAudio.currentTime = 0;
                    this.currentAudio = null;
                }
                this.isPlaying = false;
                this.savedAnimationTime = 0; // تصفير العداد الزمني تماماً
                
                if (animatedTextElement) {
                    animatedTextElement.style.transform = '';
                    animatedTextElement.style.setProperty('animation-delay', '0s', 'important');
                    animatedTextElement.style.setProperty('animation-name', 'none', 'important');
                }

                document.querySelectorAll('.audio-playing').forEach(btn => {
                    btn.innerHTML = "🔊";
                    btn.classList.remove('audio-playing');
                });
            }

            // معالجة انتهاء الصوت طبيعياً عند خط النهاية المتطابق
            handleAudioEnded(buttonElement, animatedTextElement) {
                this.resetManager(buttonElement, animatedTextElement);
                
                console.log("🏁 انتهى الصوت! تخزين النص وإظهار زر (افتح يا سمسم) فقط.");

                // 1. جلب بيانات النبتة الحالية
                const plantData = allPlants[currentIndex];

                // 2. إظهار زر "افتح يا سمسم" السحري
                const sesameBtn = document.getElementById('sesame-trigger');
                if (sesameBtn) {
                    // 🌟 الخدعة الذكية: تخزين نص "هل تعلم" داخل الزر برمجياً لمنع ضياعه
                    sesameBtn.dataset.funFact = plantData.fun_fact_ar || ""; 
                    
                    sesameBtn.style.display = 'block'; 
                    sesameBtn.classList.add('pulse-animation'); 
                }

                // 🔒 التأكد من إخفاء الفقرة والكويز لحين ضغط الزر
                const factDisplay = document.getElementById('fact-display');
                if (factDisplay) factDisplay.style.display = 'none';

                const quizArea = document.getElementById('quiz-area');
                if (quizArea) quizArea.style.display = 'none';
            }

            // إعادة ضبط المدير للحالة الافتراضية المستقرة وتحديث الأزرار
            resetManager(buttonElement, animatedTextElement) {
                this.currentAudio = null;
                this.isPlaying = false;
                this.currentPlantCode = null;
                
                if (buttonElement) {
                    buttonElement.innerHTML = "🔊";
                    buttonElement.classList.remove('audio-playing');
                }
                if (animatedTextElement) {
                    animatedTextElement.style.animationName = 'none';
                }
            }
        }

        // إنشاء نسخة عالمية واحدة ثابتة من مدير الصوت لتعمل عبر التطبيق
        const atlasAudio = new AtlasAudioManager();
        // ==========================================
        // 2. دوال التحكم والربط بالـ JSON والواجهة
        // ==========================================
        let allPlants = [];
        let currentIndex = 0;
        let isRealView = false; // المتغير المركزي الموحد لإدارة حالة العرض (false = كرتون، true = طبيعة)
        let hasAnswered = false;

        async function loadAtlasData() {
            try {
                const response = await fetch('plants.json');
                const jsonData = await response.json();
                
                allPlants = jsonData.map(plant => {
                    return {
                        character_code: plant.character_code,

                            options_ar: ["فِي الجِبَالِ وَالسُّهُولِ", "فِي أَعْمَاقِ البَحْرِ", "فِي الفَضَاءِ الخَارِجِيِّ"],
                            correct_index: 0
                        }
                    };
                });

                if (allPlants.length > 0) {
                    renderCurrentPlant();
                } else {
                    throw new Error("ملف البيانات فارغ أو غير صالح");
                }
            } catch (error) {
                console.error("❌ خطأ أثناء تحميل أو معالجة ملف الـ JSON:", error);
                const titleElement = document.getElementById('plant-title');
                if (titleElement) titleElement.innerText = "❌ خطأ في تحميل البيانات";

        }

        // 🛠️ دمج وتوحيد دالة زر مشاهدة الصورة لتعمل بشكل فوري دقيق

        // 🛠️ دالة تفاعلية مركزية تقوم بتحديث العناوين، الأشكال، ونصوص الأزرار بشكل متزامن دقيق

        // 🛠️ دالة الـ Salut الاحتفالية الديناميكية
        function triggerCelebrationSalut() {
            console.log("🎆 إطلاق مشهد الـ Salut والاحتفال بالإجابة الصحيحة!");

            // أولاً: تشغيل صوت التشجيع والاحتفال
            // تأكد من وضع ملف صوتي مبهج باسم success.mp3 داخل مجلد audio/
            const successAudio = new Audio('audio/ar/success.mp3');
            successAudio.play().catch(err => console.warn("⚠️ قيود المتصفح منعت تشغيل صوت الاحتفال تلقائياً:", err));

            // ثانياً: توليد 100 قصاصة ملونة (Confetti) بشكل عشوائي ومبهج في الشاشة
            const colors = ['#FF4081', '#00E676', '#00B0FF', '#FFEA00', '#AA00FF', '#FF9100'];
            
            for (let i = 0; i < 100; i++) {

        function onAudioClicked(buttonElement) {
            if (allPlants.length === 0) return;
            
            const plantData = allPlants[currentIndex];

            // استدعاء نظام الصوت لتشغيل أو إيقاف ملف الـ MP3 المطابق ديناميكياً
            atlasAudio.togglePlay(plantData.character_code, buttonElement);

            document.getElementById('welcome-message').style.display = 'none';
            document.getElementById('fact-display').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'none';
            
            const sesameBtn = document.getElementById('sesame-trigger');
            if (sesameBtn) sesameBtn.style.display = 'inline-block';

            const storyBox = document.getElementById('story-display');
            
            // إذا كان النظام في حالة تشغيل، نظهر الصندوق ونعرض النص المَشْكُول، وإذا أوقفناه نخفيه
            if (atlasAudio.isPlaying) {
                storyBox.style.display = 'block';
                storyBox.innerText = plantData.story_ar;
            } else {
                storyBox.style.display = 'none';
                if (document.getElementById('fact-display').style.display === 'none') {
                    document.getElementById('welcome-message').style.display = 'block';
                }
            }
        }
            
        function buildQuiz(plantData) {
            document.getElementById('quiz-question-text').innerText = plantData.quiz.question_ar;
            const optionsBox = document.getElementById('quiz-options-box');
            optionsBox.innerHTML = "";
            
            plantData.quiz.options_ar.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerText = option;
                button.onclick = () => checkAnswer(index, button, plantData.quiz.correct_index);
                optionsBox.appendChild(button);
            });
        }

        // 1. الدالة المركزية الذكية الموحدة (التي تستدعيها أزرار الـ HTML حالياً)
function navigatePlant(direction) {
    console.log("📢 [أزرار التنقل الأطلس]: الاتجاه الممرر هو ->", direction);

    const globalContainer = document.getElementById('main-app-content');
    
    if (!globalContainer) {
        console.error("❌ لم يتم العثور على main-app-content!");
        executeIndexChange(direction);
        return;
    }

    // 🎬 1. إغلاق الصفحة الحالية (إرجاعها إلى عمق الكتاب بزاوية -90 درجة)
    // نقوم بسحب الكلاس فيبدأ المتصفح تلقائياً بحركة الإغلاق التي تستغرق ثانيتين بـ الـ CSS المكتوب عندك
    globalContainer.classList.remove('page-enter');

    // ⏳ 2. ننتظر حتى تنطوي الصفحة بالكامل وتختفي (ثانيتين = 2000 ملي ثانية)
    setTimeout(() => {
        
        // 🔄 3. الآن والصفحة مخفية ومنطوية تماماً، نقوم بتحديث الصور والنصوص وتصفير الصناديق
        executeIndexChange(direction);

        // 🎬 4. إعادة فتح الصفحة الجديدة كلياً أمام الطفل
        // نقوم بإعادة حقن الكلاس السحري المعتمد لديك ليقوم بالدوران المعاكس والفتح بنعومة
        globalContainer.classList.add('page-enter');
        
        console.log("📖 ✨ [نجاح احترافي قاطع]: تم قلب الصفحة وشحن بيانات النبتة الجديدة بنجاح تنيظمي!");

    }, 1000); // 1000ms مطابقة تماماً للـ transition المكتوب في الـ CSS الخاص بك
}

        // دالة داخلية مساعدة لتغيير المؤشر وتحديث البيانات بأمان وتصفير الواجهات
        function executeIndexChange(direction) {
            // حساب المؤشر الجديد المستهدف
            const nextIndex = currentIndex + direction;

            // التأكد من أن المؤشر الجديد يقع ضمن حدود مصفوفة النباتات
            if (nextIndex >= 0 && nextIndex < allPlants.length) {
                currentIndex = nextIndex;
                console.log("🔄 [منتصف الحركة]: تم تحديث المؤشر بنجاح ليصبح:", currentIndex);

                // 🧹 تصفير الصناديق والواجهات كما اتفقنا هندسياً لتهيئتها للنبتة الجديدة
                try {
                    document.getElementById('story-display').style.display = 'none';
                    document.getElementById('fact-display').style.display = 'none';
                    document.getElementById('sesame-trigger').style.display = 'none';
                    document.getElementById('quiz-area').style.display = 'none';
                    if (typeof hasAnswered !== 'undefined') hasAnswered = false;
                    console.log("🧼 تم تصفير صناديق النتيجة والواجهات بنجاح.");
                } catch (clearError) {
                    console.warn("⚠️ تفاوت خفيف أثناء محاولة تصفير بعض العناصر:", clearError);
                }

                // شحن البيانات الجديدة للنبتة المستهدفة
                renderCurrentPlant();
                console.log("✨ تم شحن وتحديث بيانات الواجهة للنبتة رقم:", currentIndex);
            } else {
                console.log("🚫 تنبيه: لا يمكن الانتقال، لقد وصلت إلى نهاية الأطلس في هذا الاتجاه!");
            }
        }
