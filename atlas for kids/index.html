<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="app_icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أطلس النباتات - الواجهة الترحيبية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; 
            overflow: hidden; 
            /* تهيئة بيئة ثلاثية الأبعاد لمنطقة العمل بالكامل */
            perspective: 1500px; 
        }

        /* 🌟 الحاوية الرئيسية للشاشة الترحيبية (تمثل صفحة الكتاب) 🌟 */
        .splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            
            /* تحديد محور الدوران من الجهة اليمنى (ككتاب عربي ينفتح لليمين) */
            transform-origin: right center;
            
            /* إعدادات حركة الانتقال السلسة */
            backface-visibility: hidden;
            transition: transform 3s cubic-bezier(0.4, 0, 0.2, 1), opacity 3s ease-in-out;
            transform: rotateY(0deg);
            opacity: 1;
        }

        /* 🌟 الكلاس المسؤول عن تأثير قلب الصفحة ثلاثي الأبعاد 🌟 */
        .splash-container.page-flip {
            /* قلب الصفحة لليمين بزاوية 100 درجة مع إزاحتها قليلاً للخلف */
            transform: rotateY(100deg) translateX(50px);
            opacity: 0;
        }

        .splash-content {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }

        /* حاوية القناع لحجب الأطراف السوداء */
        .video-mask-wrapper {
            width: 450px;       
            height: 338px;      
            margin: 0 auto 25px auto;
            overflow: hidden;   
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); 
            position: relative;
            background-color: #ffffff;
        }

        .splash-video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 24px;
            background-color: #ffffff;
        }

        .splash-title {
            color: #2e7d32;
            font-size: 2.6rem;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .splash-subtitle {
            color: #689f38;
            font-size: 1.7rem;
            margin-bottom: 35px;
            font-weight: 500;
        }

        /* أزرار التحكم والبدء */
        .start-button {
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            padding: 15px 45px;
            font-size: 1.8rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(46, 125, 50, 0.2);
            transition: all 0.3s ease;
            outline: none;
            margin-bottom: 20px;
            display: inline-block;
        }

        .start-button:hover {
            background-color: #1b5e20;
            transform: scale(1.03);
        }

        .skip-button {
            background-color: transparent;
            border: 1px solid #9e9e9e;
            color: #757575;
            padding: 6px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: block;
            margin: 0 auto;
        }

        .skip-button:hover {
            border-color: #2e7d32;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div id="splash-screen" class="splash-container">
        <div class="splash-content">
            
            <div class="video-mask-wrapper">
                <video id="welcome-video" class="splash-video" preload="auto" playsinline muted>
                    <source src="welcome_video.mp4" type="video/mp4">
                    المتصفح لا يدعم الفيديو.
                </video>
            </div>
            
            <h1 class="splash-title">أَطْلَسُ النَّبَاتَاتِ</h1>
            <p class="splash-subtitle">وَالأَزْهَارِ البَرِّيَّةِ</p>
            
            <button id="start-btn" class="start-button">لِنَبْدَأْ ! </button>
           
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const splashScreen = document.getElementById("splash-screen");
            const welcomeVideo = document.getElementById("welcome-video");
            const startBtn = document.getElementById("start-btn");
           
            // دالة انتقال قلب الصفحة (Book Page Flip)
            function bookPageFlipTransition() {
                welcomeVideo.pause(); // إيقاف تشغيل الفيديو فوراً
                
                // 1. تفعيل حركية قلب الصفحة لليمين ثلاثية الأبعاد
                splashScreen.classList.add("page-flip");

                // 2. الانتظار حتى تنطوي الصفحة بالكامل (1000 مللي ثانية) لفتح ملف index.html
                setTimeout(() => {
                    window.location.href = "atlas_kids.html";
                }, 3000); 
            }

            // عند الضغط على زر لنبدأ -> تشغيل فيديو أطلس
           // عند الضغط على زر لنبدأ -> تشغيل فيديو أطلس مع تفعيل الصوت إجبارياً
           // عند الضغط على زر لنبدأ -> تشغيل فيديو أطلس
            startBtn.addEventListener("click", () => {
                startBtn.innerText = "استمع يا صديقي";
                startBtn.style.pointerEvents = "none";
                startBtn.style.backgroundColor = "#689f38";

                // 1. تشغيل الفيديو أولاً وهو في حالته المكتومة الافتراضية (لتخطي قفل المتصفح)
                welcomeVideo.play().then(() => {
                    // 2. فور نجاح التشغيل، نقوم بفك الكتم ورفع الصوت برمجياً في نفس اللحظة!
                    welcomeVideo.muted = false;
                    welcomeVideo.volume = 1.0;
                }).catch(error => {
                    console.error("خطأ في تشغيل الفيديو:", error);
                    bookPageFlipTransition(); 
                });
            });

            // عند انتهاء الفيديو بالكامل -> فتح الكتاب تلقائياً
            welcomeVideo.addEventListener("ended", () => { 
                bookPageFlipTransition(); 
            });

          });
    </script>
</body>
</html>
